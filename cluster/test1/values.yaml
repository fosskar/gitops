clusterName: "test1" # Will be set by ApplicationSet

# Override global defaults for test-cluster
network:
  vip: 10.10.10.100
  ipRange: "10.10.10.101-10.10.10.110"

# Extra tags for VMs
extraTags:
  - test-env

# Node Definitions (inherits specs from nodeDefaults.single-node)
nodes:
  - name: test-control-plane-1
    type: single-node # Single node that acts as both control plane and allows workloads
    # vmID: 1050 # Specific VM ID for this node - commented out to test auto-assignment
    # memory, cores, disk inherited from global nodeDefaults.single-node
