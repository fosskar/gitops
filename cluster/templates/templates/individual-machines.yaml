{{- $workerCount := 0 }}
{{- range .Values.nodes }}
  {{- if eq .type "worker" }}
    {{- $workerCount = add $workerCount 1 }}
  {{- end }}
{{- end }}

{{- $workerIndex := 0 }}
{{- range .Values.nodes }}

{{- if eq .type "worker" }}
{{- $workerIndex = add $workerIndex 1 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachine
metadata:
  name: {{ $.Values.clusterName }}-worker-{{ $workerIndex }}
  namespace: {{ $.Values.targetNamespace | default "default" }}
spec:
  disks:
    bootVolume:
      disk: scsi0
      sizeGb: {{ .disk | default $.Values.nodeDefaults.worker.disk }}
  format: qcow2
  full: true
  memoryMiB: {{ .memory | default $.Values.nodeDefaults.worker.memory }}
  network:
    default:
      bridge: {{ $.Values.network.bridge }}
      model: virtio
      vlan: {{ $.Values.network.vlan }}
  numCores: {{ .cores | default $.Values.nodeDefaults.worker.cores }}
  numSockets: 1
  sourceNode: {{ $.Values.proxmox.node }}
  templateID: {{ $.Values.proxmox.templateId }}
  vmIDRange:
    start: {{ (splitList "-" $.Values.proxmox.vmIdRange) | first }}
    end: {{ (splitList "-" $.Values.proxmox.vmIdRange) | last }}
  checks:
    skipCloudInitStatus: true
    skipQemuGuestAgent: true
  metadataSettings:
    providerIDInjection: true
  tags:
    - {{ $.Values.clusterName }}
    - {{ $.Values.clusterName }}-worker
{{- range $.Values.extraTags }}
    - {{ . }}
{{- end }}

---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfig
metadata:
  name: {{ $.Values.clusterName }}-worker-{{ $workerIndex }}
  namespace: {{ $.Values.targetNamespace | default "default" }}
spec:
  generateType: worker
  strategicPatches:
    - |
      - op: replace
        path: /machine/install
        value:
          disk: /dev/sda
          extensions:
            - image: ghcr.io/siderolabs/qemu-guest-agent:9.2.0
      - op: add
        path: /machine/install/extraKernelArgs
        value:
          - net.ifnames=0
{{- if $.Values.network.dnsServers }}
      - op: add
        path: /machine/network/nameservers
        value:
{{- range $.Values.network.dnsServers }}
          - {{ . }}
{{- end }}
{{- end }}
      - op: add
        path: /machine/network/disableSearchDomain
        value: true
      - op: add
        path: /machine/network/interfaces
        value:
          - interface: eth0
            dhcp: false
      - op: add
        path: /machine/kubelet/extraArgs
        value:
          cloud-provider: external
          rotate-server-certificates: "true"
      # fix for coredns connectivity issues with cilium kube-proxy replacement on talos
      # see: https://www.talos.dev/v1.10/kubernetes-guides/network/deploying-cilium/
      # related: https://github.com/cilium/cilium/issues/12847
      - op: add
        path: /machine/features/hostDNS
        value:
          enabled: true
          forwardKubeDNSToHost: false

---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Machine
metadata:
  name: {{ $.Values.clusterName }}-worker-{{ $workerIndex }}
  namespace: {{ $.Values.targetNamespace | default "default" }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ $.Values.clusterName }}
    node-role.kubernetes.io/worker: ""
spec:
  clusterName: {{ $.Values.clusterName }}
  version: {{ $.Values.kubernetes.version }}
  bootstrap:
    configRef:
      apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
      kind: TalosConfig
      name: {{ $.Values.clusterName }}-worker-{{ $workerIndex }}
      namespace: {{ $.Values.targetNamespace | default "default" }}
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: ProxmoxMachine
    name: {{ $.Values.clusterName }}-worker-{{ $workerIndex }}
    namespace: {{ $.Values.targetNamespace | default "default" }}
{{- end }}
{{- end }}
