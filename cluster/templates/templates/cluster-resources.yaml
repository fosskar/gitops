---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxCluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  credentialsRef:
    name: {{ .Values.proxmox.credentialsSecret }}
    namespace: {{ .Values.targetNamespace | default "default" }}
  allowedNodes:
    - {{ .Values.proxmox.node }}
  controlPlaneEndpoint:
    host: {{ .Values.network.vip }}
    port: 6443
  dnsServers:
    {{- range .Values.network.dnsServers }}
    - {{ . }}
    {{- end }}
  ipv4Config:
    addresses:
      - {{ .Values.network.ipRange }}
    gateway: {{ .Values.network.gateway }}
    prefix: 24
  schedulerHints:
    memoryAdjustment: 0
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
    kind: TalosControlPlane
    name: {{ .Values.clusterName }}-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: ProxmoxCluster
    name: {{ .Values.clusterName }}
---
{{- $controlPlaneCount := 0 }}
{{- $singleNodeCount := 0 }}
{{- $workerCount := 0 }}
{{- range .Values.nodes }}
  {{- if eq .type "control-plane" }}
    {{- $controlPlaneCount = add $controlPlaneCount 1 }}
  {{- else if eq .type "single-node" }}
    {{- $singleNodeCount = add $singleNodeCount 1 }}
  {{- else if eq .type "worker-node" }}
    {{- $workerCount = add $workerCount 1 }}
  {{- end }}
{{- end }}
{{- $totalControlPlanes := add $controlPlaneCount $singleNodeCount }}

{{- if gt $totalControlPlanes 0 }}
{{- $firstControlPlaneNode := "" }}
{{- range .Values.nodes }}
  {{- if or (eq .type "control-plane") (eq .type "single-node") }}
    {{- if eq $firstControlPlaneNode "" }}
      {{- $firstControlPlaneNode = . }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: {{ .Values.clusterName }}-control-plane-template
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: {{ $firstControlPlaneNode.disk }}
      format: qcow2
      full: true
      memoryMiB: {{ $firstControlPlaneNode.memory }}
      network:
        default:
          bridge: {{ .Values.network.bridge }}
          model: virtio
          vlan: {{ .Values.network.vlan }}
      numCores: {{ $firstControlPlaneNode.cores }}
      numSockets: 1
      sourceNode: {{ .Values.proxmox.node }}
      templateID: {{ .Values.proxmox.templateId }}
      agent: 1
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
      tags:
        - {{ .Values.clusterName }}
        - control-plane
        - cluster-api
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: {{ .Values.clusterName }}-cp
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  version: {{ .Values.kubernetes.version }}
  replicas: {{ $totalControlPlanes }}
  infrastructureTemplate:
    kind: ProxmoxMachineTemplate
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    name: {{ .Values.clusterName }}-control-plane-template
    namespace: {{ .Values.targetNamespace | default "default" }}
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      strategicPatches:
        - |
          - op: replace
            path: /machine/install
            value:
              disk: /dev/sda
              extensions:
                - image: ghcr.io/siderolabs/qemu-guest-agent:9.2.0
          - op: add
            path: /machine/install/extraKernelArgs
            value:
              - net.ifnames=0
          - op: add
            path: /machine/network/interfaces
            value:
              - interface: eth0
                dhcp: false
                vip:
                  ip: {{ .Values.network.vip }}
          - op: add
            path: /cluster/externalCloudProvider
            value:
              enabled: true
              manifests:
                - https://raw.githubusercontent.com/siderolabs/talos-cloud-controller-manager/main/docs/deploy/cloud-controller-manager.yml
              - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
        - op: add
          path: /machine/kubelet/extraArgs
          value:
            cloud-provider: external
            rotate-server-certificates: "true"
        - op: add
          path: /machine/features/kubernetesTalosAPIAccess
          value:
            enabled: true
            allowedRoles:
              - os:reader
            allowedKubernetesNamespaces:
              - kube-system
{{- if gt $singleNodeCount 0 }}
        - op: add
          path: /cluster/allowSchedulingOnControlPlanes
          value: true
{{- end }}
{{- end }}

{{- if gt $workerCount 0 }}
{{- $firstWorkerNode := "" }}
{{- range .Values.nodes }}
  {{- if eq .type "worker-node" }}
    {{- if eq $firstWorkerNode "" }}
      {{- $firstWorkerNode = . }}
    {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: {{ .Values.clusterName }}-worker-template
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: {{ $firstWorkerNode.disk }}
      format: qcow2
      full: true
      memoryMiB: {{ $firstWorkerNode.memory }}
      network:
        default:
          bridge: {{ .Values.network.bridge }}
          model: virtio
          vlan: {{ .Values.network.vlan }}
      numCores: {{ $firstWorkerNode.cores }}
      numSockets: 1
      sourceNode: {{ .Values.proxmox.node }}
      templateID: {{ .Values.proxmox.templateId }}
      agent: 1
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
      tags:
        - {{ .Values.clusterName }}
        - worker-node
        - cluster-api
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ .Values.clusterName }}-workers
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  clusterName: {{ .Values.clusterName }}
  replicas: {{ $workerCount }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ .Values.clusterName }}
      cluster.x-k8s.io/deployment-name: {{ .Values.clusterName }}-workers
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ .Values.clusterName }}
        cluster.x-k8s.io/deployment-name: {{ .Values.clusterName }}-workers
    spec:
      clusterName: {{ .Values.clusterName }}
      version: {{ .Values.kubernetes.version }}
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: {{ .Values.clusterName }}-workers
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ProxmoxMachineTemplate
        name: {{ .Values.clusterName }}-worker-template
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: {{ .Values.clusterName }}-workers
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  template:
    spec:
      generateType: worker
      strategicPatches:
        - |
          - op: replace
            path: /machine/install
            value:
              disk: /dev/sda
              extensions:
                - image: ghcr.io/siderolabs/qemu-guest-agent:9.2.0
          - op: add
            path: /machine/install/extraKernelArgs
            value:
              - net.ifnames=0
          - op: add
            path: /machine/kubelet/extraArgs
            value:
              cloud-provider: external
            rotate-server-certificates: "true"
{{- end }}