apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-proxmox-credentials
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: kubernetes-secret-store
    kind: SecretStore
  target:
    name: {{ .Values.proxmox.credentialsSecret }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.proxmox.credentialsSecret }}
        property: token
    - secretKey: secret
      remoteRef:
        key: {{ .Values.proxmox.credentialsSecret }}
        property: secret
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: kubernetes-secret-store
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  provider:
    kubernetes:
      remoteNamespace: default  # Source namespace where original secret exists
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-sa
          namespace: external-secrets-system