{{/* Generate ProxmoxMachineTemplate for each node type */}}
{{- $controlPlaneCount := 0 }}
{{- $workerIndex := 0 }}
{{- $singleNodeCount := 0 }}
{{- $processedControlPlane := false }}
{{- $processedWorker := false }}

{{/* Count nodes by type */}}
{{- range .Values.nodes }}
  {{- if eq .type "control-plane" }}
    {{- $controlPlaneCount = add $controlPlaneCount 1 }}
  {{- else if eq .type "single-node" }}
    {{- $singleNodeCount = add $singleNodeCount 1 }}
  {{- end }}
{{- end }}

{{/* Generate templates */}}
{{- range $nodeIndex, $node := .Values.nodes }}
{{- $nodeName := $node.name }}
{{- $shouldGenerate := true }}

{{/* For control-plane: only generate ONE shared template */}}
{{- if eq $node.type "control-plane" }}
  {{- if $processedControlPlane }}
    {{- $shouldGenerate = false }}
  {{- else }}
    {{- $processedControlPlane = true }}
    {{- $nodeName = printf "%s-control-plane" $.Values.clusterName }}
  {{- end }}
{{/* For workers: only generate ONE shared template */}}
{{- else if eq $node.type "worker" }}
  {{- if $processedWorker }}
    {{- $shouldGenerate = false }}
  {{- else }}
    {{- $processedWorker = true }}
    {{- $nodeName = printf "%s-worker" $.Values.clusterName }}
  {{- end }}
{{/* For single-node: use cluster name */}}  
{{- else if eq $node.type "single-node" }}
  {{- if not $nodeName }}
    {{- $nodeName = $.Values.clusterName }}
  {{- end }}
{{- end }}

{{- if $shouldGenerate }}

{{/* Merge node specs with defaults */}}
{{- $defaultSpecs := index $.Values.nodeDefaults $node.type }}
{{- $memory := $node.memory | default $defaultSpecs.memory }}
{{- $cores := $node.cores | default $defaultSpecs.cores }}
{{- $disk := $node.disk | default $defaultSpecs.disk }}
{{- $vmID := $node.vmID | default $defaultSpecs.vmID }}

{{- if gt $nodeIndex 0 }}
---
{{- end }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $nodeName }}
  namespace: {{ $.Values.targetNamespace | default "default" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: {{ $disk }}
      format: qcow2
      full: true
      memoryMiB: {{ $memory }}
      network:
        default:
          bridge: {{ $.Values.network.bridge }}
          model: virtio
          vlan: {{ $.Values.network.vlan }}
      numCores: {{ $cores }}
      numSockets: 1
      sourceNode: {{ $.Values.proxmox.node }}
      templateID: {{ $.Values.proxmox.templateId }}
{{- if $vmID }}
      virtualMachineID: {{ $vmID }}
{{- else if $.Values.proxmox.vmIdRange }}
      vmIDRange:
        start: {{ (split "-" $.Values.proxmox.vmIdRange)._0 | int }}
        end: {{ (split "-" $.Values.proxmox.vmIdRange)._1 | int }}
{{- end }}
      checks:
        skipCloudInitStatus: true
        skipQemuGuestAgent: true
      metadataSettings:
        providerIDInjection: true
      tags:
        - {{ $.Values.clusterName }}
{{- if ne $nodeName $.Values.clusterName }}
        - {{ $nodeName }}
{{- end }}
{{- if and $node.ip (eq $node.type "single-node") }}
        - {{ $node.ip }}
{{- else if eq $node.type "control-plane" }}
        - {{ $.Values.network.vip }}
{{- else if $node.ip }}
        - {{ $node.ip }}
{{- else }}
        - {{ $.Values.network.ipRange }}
{{- end }}
{{- range $.Values.extraTags | default (list) }}
        - {{ . }}
{{- end }}
{{- end }}
{{- end }}
