{{- $controlPlaneCount := 0 }}
{{- $singleNodeCount := 0 }}
{{- $workerCount := 0 }}
{{- range .Values.nodes }}
  {{- if eq .type "control-plane" }}
    {{- $controlPlaneCount = add $controlPlaneCount 1 }}
  {{- else if eq .type "single-node" }}
    {{- $singleNodeCount = add $singleNodeCount 1 }}
  {{- else if eq .type "worker" }}
    {{- $workerCount = add $workerCount 1 }}
  {{- end }}
{{- end }}

{{- $totalControlPlanes := add $controlPlaneCount $singleNodeCount }}

{{/* Control Plane / Single Node Template */}}
{{- if gt $totalControlPlanes 0 }}
{{- $firstControlPlaneNode := dict }}
{{- $controlPlaneIndex := 0 }}
{{- range .Values.nodes }}
  {{- if or (eq .type "control-plane") (eq .type "single-node") }}
    {{- $controlPlaneIndex = add $controlPlaneIndex 1 }}
    {{- if not $firstControlPlaneNode.type }}
      {{- $firstControlPlaneNode = . }}
    {{- end }}
  {{- end }}
{{- end }}

{{/* Auto-generate node name if not provided */}}
{{- $nodeName := "" }}
{{- if $firstControlPlaneNode.name }}
  {{- $nodeName = $firstControlPlaneNode.name }}
{{- else }}
  {{- if eq $firstControlPlaneNode.type "single-node" }}
    {{- $nodeName = printf "%s-single-1" .Values.clusterName }}
  {{- else }}
    {{- $nodeName = printf "%s-control-1" .Values.clusterName }}
  {{- end }}
{{- end }}

{{/* Merge node specs with defaults */}}
{{- $nodeType := "single-node" }}
{{- if eq $firstControlPlaneNode.type "control-plane" }}
  {{- $nodeType = "control-plane" }}
{{- end }}
{{- $defaultSpecs := index .Values.nodeDefaults $nodeType }}
{{- $memory := $firstControlPlaneNode.memory | default $defaultSpecs.memory }}
{{- $cores := $firstControlPlaneNode.cores | default $defaultSpecs.cores }}
{{- $disk := $firstControlPlaneNode.disk | default $defaultSpecs.disk }}
{{- $vmID := $firstControlPlaneNode.vmID | default $defaultSpecs.vmID }}

apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $nodeName }}
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: {{ $disk }}
      format: qcow2
      full: true
      memoryMiB: {{ $memory }}
      network:
        default:
          bridge: {{ .Values.network.bridge }}
          model: virtio
          vlan: {{ .Values.network.vlan }}
      numCores: {{ $cores }}
      numSockets: 1
      sourceNode: {{ .Values.proxmox.node }}
      templateID: {{ .Values.proxmox.templateId }}
{{- if $vmID }}
      virtualMachineID: {{ $vmID }}
{{- else if .Values.proxmox.vmIdRange }}
      vmIDRange:
        start: {{ (split "-" .Values.proxmox.vmIdRange)._0 | int }}
        end: {{ (split "-" .Values.proxmox.vmIdRange)._1 | int }}
{{- end }}
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
      tags:
        - {{ .Values.clusterName }}
        - {{ $nodeName }}
{{- if $firstControlPlaneNode.ip }}
        - {{ $firstControlPlaneNode.ip }}
{{- else }}
        - {{ .Values.network.vip }}
{{- end }}
{{- range .Values.extraTags | default (list) }}
        - {{ . }}
{{- end }}
{{- end }}

{{/* Worker Node Template */}}
{{- if gt $workerCount 0 }}
---
{{- $firstWorkerNode := dict }}
{{- $workerIndex := 0 }}
{{- range .Values.nodes }}
  {{- if eq .type "worker" }}
    {{- $workerIndex = add $workerIndex 1 }}
    {{- if not $firstWorkerNode.type }}
      {{- $firstWorkerNode = . }}
    {{- end }}
  {{- end }}
{{- end }}

{{/* Auto-generate worker node name if not provided */}}
{{- $workerNodeName := $firstWorkerNode.name }}
{{- if not $workerNodeName }}
  {{- $workerNodeName = printf "%s-worker-1" .Values.clusterName }}
{{- end }}

{{/* Merge worker node specs with defaults */}}
{{- $defaultSpecs := index .Values.nodeDefaults "worker" }}
{{- $memory := $firstWorkerNode.memory | default $defaultSpecs.memory }}
{{- $cores := $firstWorkerNode.cores | default $defaultSpecs.cores }}
{{- $disk := $firstWorkerNode.disk | default $defaultSpecs.disk }}
{{- $vmID := $firstWorkerNode.vmID | default $defaultSpecs.vmID }}

apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $workerNodeName }}
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: {{ $disk }}
      format: qcow2
      full: true
      memoryMiB: {{ $memory }}
      network:
        default:
          bridge: {{ .Values.network.bridge }}
          model: virtio
          vlan: {{ .Values.network.vlan }}
      numCores: {{ $cores }}
      numSockets: 1
      sourceNode: {{ .Values.proxmox.node }}
      templateID: {{ .Values.proxmox.templateId }}
{{- if $vmID }}
      virtualMachineID: {{ $vmID }}
{{- else if .Values.proxmox.vmIdRange }}
      vmIDRange:
        start: {{ (split "-" .Values.proxmox.vmIdRange)._0 | int }}
        end: {{ (split "-" .Values.proxmox.vmIdRange)._1 | int }}
{{- end }}
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
      tags:
        - {{ .Values.clusterName }}
        - {{ $workerNodeName }}
{{- if $firstWorkerNode.ip }}
        - {{ $firstWorkerNode.ip }}
{{- else }}
        - {{ .Values.network.ipRange }}
{{- end }}
{{- range .Values.extraTags | default (list) }}
        - {{ . }}
{{- end }}
{{- end }}
