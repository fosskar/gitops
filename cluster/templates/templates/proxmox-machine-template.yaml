{{/* Generate ProxmoxMachineTemplate for each node */}}
{{- $controlPlaneIndex := 0 }}
{{- $workerIndex := 0 }}
{{- $singleNodeIndex := 0 }}
{{- range $nodeIndex, $node := .Values.nodes }}

{{/* Generate node name if not provided */}}
{{- $nodeName := $node.name }}
{{- if not $nodeName }}
  {{- if eq $node.type "control-plane" }}
    {{- $controlPlaneIndex = add $controlPlaneIndex 1 }}
    {{- $nodeName = printf "%s-control-%d" $.Values.clusterName $controlPlaneIndex }}
  {{- else if eq $node.type "worker" }}
    {{- $workerIndex = add $workerIndex 1 }}
    {{- $nodeName = printf "%s-worker-%d" $.Values.clusterName $workerIndex }}
  {{- else if eq $node.type "single-node" }}
    {{- $nodeName = $.Values.clusterName }}
  {{- end }}
{{- end }}

{{/* Merge node specs with defaults */}}
{{- $defaultSpecs := index $.Values.nodeDefaults $node.type }}
{{- $memory := $node.memory | default $defaultSpecs.memory }}
{{- $cores := $node.cores | default $defaultSpecs.cores }}
{{- $disk := $node.disk | default $defaultSpecs.disk }}
{{- $vmID := $node.vmID | default $defaultSpecs.vmID }}

{{- if gt $nodeIndex 0 }}
---
{{- end }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $nodeName }}
  namespace: {{ $.Values.targetNamespace | default "default" }}
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: {{ $disk }}
      format: qcow2
      full: true
      memoryMiB: {{ $memory }}
      network:
        default:
          bridge: {{ $.Values.network.bridge }}
          model: virtio
          vlan: {{ $.Values.network.vlan }}
      numCores: {{ $cores }}
      numSockets: 1
      sourceNode: {{ $.Values.proxmox.node }}
      templateID: {{ $.Values.proxmox.templateId }}
{{- if $vmID }}
      virtualMachineID: {{ $vmID }}
{{- else if $.Values.proxmox.vmIdRange }}
      vmIDRange:
        start: {{ (split "-" $.Values.proxmox.vmIdRange)._0 | int }}
        end: {{ (split "-" $.Values.proxmox.vmIdRange)._1 | int }}
{{- end }}
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
      tags:
        - {{ $.Values.clusterName }}
        - {{ $nodeName }}
{{- if $node.ip }}
        - {{ $node.ip }}
{{- else if or (eq $node.type "control-plane") (eq $node.type "single-node") }}
        - {{ $.Values.network.vip }}
{{- else }}
        - {{ $.Values.network.ipRange }}
{{- end }}
{{- range $.Values.extraTags | default (list) }}
        - {{ . }}
{{- end }}
{{- end }}
