{{- $controlPlaneCount := 0 }}
{{- $singleNodeCount := 0 }}
{{- range .Values.nodes }}
  {{- if eq .type "control-plane" }}
    {{- $controlPlaneCount = add $controlPlaneCount 1 }}
  {{- else if eq .type "single-node" }}
    {{- $singleNodeCount = add $singleNodeCount 1 }}
  {{- end }}
{{- end }}

{{- $totalControlPlanes := add $controlPlaneCount $singleNodeCount }}

{{- if gt $totalControlPlanes 0 }}
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: {{ .Values.clusterName }}-cp
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  version: {{ .Values.kubernetes.version }}
  replicas: {{ $totalControlPlanes }}
  rolloutStrategy:
{{- if eq $totalControlPlanes 1 }}
    type: Recreate
{{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
{{- end }}
  infrastructureTemplate:
    kind: ProxmoxMachineTemplate
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    name: {{ .Values.clusterName }}-control-plane
    namespace: {{ .Values.targetNamespace | default "default" }}
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      strategicPatches:
        - |
          - op: replace
            path: /machine/install
            value:
              disk: /dev/sda
              extensions:
                - image: ghcr.io/siderolabs/qemu-guest-agent:9.2.0
          - op: add
            path: /machine/install/extraKernelArgs
            value:
              - net.ifnames=0
          - op: add
            path: /machine/network/nameservers
            value:
            {{- range .Values.network.dnsServers }}
              - {{ . }}
            {{- end }}
          - op: add
            path: /machine/network/disableSearchDomain
            value: true
          - op: add
            path: /machine/network/interfaces
            value:
              - interface: eth0
                dhcp: false
                vip:
                  ip: {{ .Values.network.vip }}
          - op: add
            path: /cluster/externalCloudProvider
            value:
              enabled: true
              manifests:
                - https://raw.githubusercontent.com/siderolabs/talos-cloud-controller-manager/main/docs/deploy/cloud-controller-manager.yml
                - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
          - op: add
            path: /machine/kubelet/extraArgs
            value:
              cloud-provider: external
              rotate-server-certificates: "true"
          - op: add
            path: /machine/features/kubernetesTalosAPIAccess
            value:
              enabled: true
              allowedRoles:
                - os:reader
              allowedKubernetesNamespaces:
                - kube-system
          {{- if .Values.cni.cilium.enabled }}
          - op: add
            path: /cluster/network/cni
            value:
              name: none
          {{- if .Values.cni.cilium.kubeProxyReplacement }}
          - op: add
            path: /cluster/proxy
            value:
              disabled: true
          {{- end }}
          - op: add
            path: /cluster/inlineManifests
            value:
              - name: cilium-install
                contents: |
                  ---
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: cilium-install
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: cluster-admin
                  subjects:
                  - kind: ServiceAccount
                    name: cilium-install
                    namespace: kube-system
                  ---
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: cilium-install
                    namespace: kube-system
                  ---
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: cilium-install
                    namespace: kube-system
                  spec:
                    backoffLimit: 10
                    template:
                      metadata:
                        labels:
                          app: cilium-install
                      spec:
                        restartPolicy: OnFailure
                        tolerations:
                          - operator: Exists
                          - effect: NoSchedule
                            operator: Exists
                          - effect: NoExecute
                            operator: Exists
                          - effect: PreferNoSchedule
                            operator: Exists
                          - key: node-role.kubernetes.io/control-plane
                            operator: Exists
                            effect: NoSchedule
                          - key: node-role.kubernetes.io/control-plane
                            operator: Exists
                            effect: NoExecute
                          - key: node-role.kubernetes.io/control-plane
                            operator: Exists
                            effect: PreferNoSchedule
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: node-role.kubernetes.io/control-plane
                                      operator: Exists
                        serviceAccount: cilium-install
                        serviceAccountName: cilium-install
                        hostNetwork: true
                        containers:
                        - name: cilium-install
                          image: quay.io/cilium/cilium-cli:latest
                          env:
                          - name: KUBERNETES_SERVICE_HOST
                            valueFrom:
                              fieldRef:
                                apiVersion: v1
                                fieldPath: status.podIP
                          - name: KUBERNETES_SERVICE_PORT
                            value: "6443"
                          command:
                            - cilium
                            - install
                            - --version
                            - {{ .Values.cni.cilium.version }}
                            - --set
                            - ipam.mode=kubernetes
                            {{- if .Values.cni.cilium.kubeProxyReplacement }}
                            - --set
                            - kubeProxyReplacement=true
                            {{- end }}
                            - --set
                            - "securityContext.capabilities.ciliumAgent={CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}"
                            - --set
                            - "securityContext.capabilities.cleanCiliumState={NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}"
                            - --set
                            - cgroup.autoMount.enabled=false
                            - --set
                            - cgroup.hostRoot=/sys/fs/cgroup
                            - --set
                            - k8sServiceHost=localhost
                            - --set
                            - k8sServicePort=7445
          # fix for coredns connectivity issues with cilium kube-proxy replacement on talos
          # see: https://www.talos.dev/v1.10/kubernetes-guides/network/deploying-cilium/
          # related: https://github.com/cilium/cilium/issues/12847
          - op: add
            path: /machine/features/hostDNS
            value:
              enabled: true
              forwardKubeDNSToHost: false
{{- end }}
{{- end }}
