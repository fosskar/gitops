apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxCluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.targetNamespace | default "default" }}
spec:
  credentialsRef:
    name: {{ .Values.proxmox.credentialsSecret }}
    namespace: {{ .Values.targetNamespace | default "default" }}
  allowedNodes:
    - {{ .Values.proxmox.node }}
  controlPlaneEndpoint:
    host: {{ .Values.network.vip }}
    port: 6443
  dnsServers:
    {{- range .Values.network.dnsServers }}
    - {{ . }}
    {{- end }}
  ipv4Config:
    addresses:
      - {{ .Values.network.ipRange }}
    gateway: {{ .Values.network.gateway }}
    prefix: 24
  schedulerHints:
    memoryAdjustment: 0