# Global defaults for all clusters
clusterName: ""  # Will be set by ApplicationSet
targetNamespace: "default"  # Will be overridden by ApplicationSet

# Network Configuration (global defaults)
network:
  vip: ""  # Must be overridden per cluster
  ipRange: ""  # Must be overridden per cluster
  gateway: 10.10.10.1  # Common gateway
  bridge: vmbr1  # Standard bridge
  vlan: 10  # Standard VLAN

# Proxmox Configuration (global defaults)
proxmox:
  node: prx-prd-1  # Default node
  templateId: 999  # Standard template ID
  credentialsSecret: proxmox-credentials  # Standard secret name
  # Optional: VM ID range configuration (alternative to specific vmID)
  vmIdRange: "110-120"  # VM ID range for automatic assignment

# Kubernetes Configuration (global defaults)
kubernetes:
  version: v1.33.3  # Default k8s version

# Default Node Specifications
nodeDefaults:
  control-plane:
    memory: 4096
    cores: 2
    disk: 50
  worker:
    memory: 8192
    cores: 2
    disk: 100
  single-node:
    memory: 4096
    cores: 2
    disk: 100

# Nodes must be defined per cluster
nodes: []

# CNI Configuration
cni:
  cilium:
    enabled: false
    version: "1.18.1"  # cilium helm chart version
    kubeProxyReplacement: true  # disable kube-proxy for better performance
    gatewayAPI: false  # enable for gateway api support

# Cluster Addons (via CAAPH - Cluster API Addon Provider Helm)
# GitOps Configuration
gitops:
  argocd:
    enabled: false
    namespace: argocd
    version: "8.3.0"  # argo-cd helm chart version
    # Generate password hash with: echo -n 'your-password' | htpasswd -bnBC 12 "" | tr -d ':\n'
    adminPassword: "$2a$12$EXAMPLE_BCRYPT_HASH"  # override per cluster
    server:
      service:
        type: LoadBalancer  # or NodePort, ClusterIP
    bootstrap:
      enabled: false
