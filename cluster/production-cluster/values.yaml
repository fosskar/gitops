# Override global defaults for production-cluster
network:
  vip: 10.10.10.200
  ipRange: "10.10.10.201-10.10.10.220"

# Use different Proxmox node
proxmox:
  node: prx-prd-2

# Upgrade kubernetes version
kubernetes:
  version: v1.34.0

# Complex multi-node setup with custom specs
nodes:
  # 3 control plane nodes with custom high-performance specs
  - name: cp-1
    type: control-plane
    memory: 8192    # Override default 4096
    cores: 4        # Override default 2
    disk: 100       # Override default 40
  - name: cp-2
    type: control-plane
    memory: 8192
    cores: 4
    disk: 100
  - name: cp-3
    type: control-plane
    memory: 8192
    cores: 4
    disk: 100
  
  # 5 worker nodes - some inherit defaults, others override
  - name: worker-1
    type: worker-node
    # Uses nodeDefaults.worker-node (8192M, 4 cores, 100GB)
  - name: worker-2
    type: worker-node
    # Uses defaults
  - name: worker-3
    type: worker-node
    memory: 16384   # High-memory node
    disk: 200       # Large disk
  - name: worker-4
    type: worker-node
    cores: 8        # High-CPU node
  - name: worker-5
    type: worker-node
    memory: 32768   # Very high-memory node
    cores: 8
    disk: 500