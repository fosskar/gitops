# Override global defaults for single-node cluster
network:
  # Forced to use different IP due to broken validation
  ipRange: "10.10.10.102"
  gateway: 10.10.10.1

# Use VM ID range for this cluster
proxmox:
  vmIdRange: "110-120"

# Extra tags for VMs
extraTags: []

# Node Definitions (inherits specs from nodeDefaults.single-node)
nodes:
  - type: single-node # Single node that acts as both control plane and allows workloads
    ip: 10.10.10.101 # Use same IP as the range
    # vmID: 110 # Let's try vmIDRange approach instead
    # memory, cores, disk inherited from global nodeDefaults.single-node
