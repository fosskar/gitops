# Override global defaults for single-node cluster
network:
  vip: 10.10.10.10
  # DHCP range that doesn't conflict with static IPs (101,102,105,106)
  ipRange: "10.10.10.120-10.10.10.130"
  gateway: 10.10.10.1

# Use smaller VM ID range for predictable ordering (4 VMs = 111-114)
proxmox:
  vmIdRange: "111-114"

# Extra tags for VMs (create these in Proxmox with custom colors first)
extraTags: []

# Node Definitions with fixed VM IDs for predictable ordering
nodes:
  - type: control-plane
    ip: 10.10.10.101
  - type: control-plane
    ip: 10.10.10.102
  - type: worker
    ip: 10.10.10.105
  - type: worker
    ip: 10.10.10.106
