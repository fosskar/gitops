# Override global defaults for single-node cluster
network:
  vip: 10.10.10.10
  # IP range for CAPMOX to assign automatically (like test-cluster.yaml.backup)
  ipRange: "10.10.10.101-10.10.10.110"
  gateway: 10.10.10.1

# Use smaller VM ID range for predictable ordering (4 VMs = 111-114)
proxmox:
  vmIdRange: "111-115"

# Extra tags for VMs (create these in Proxmox with custom colors first)
extraTags: []

# Node Definitions (IPs assigned automatically by CAPMOX from ipRange)
nodes:
  - type: control-plane
  - type: worker
    memory: 16384 # 16GB
    cores: 4
    disk: 100
  - type: worker
    memory: 16384 # 16GB
    cores: 4
    disk: 100
  - type: worker
    memory: 16384 # 16GB
    cores: 4
    disk: 100

# Enable Cilium CNI
cni:
  cilium:
    enabled: true
    version: "1.18.1"
    kubeProxyReplacement: true

# GitOps Configuration
gitops:
  argocd:
    enabled: true
    adminPassword: "$2y$12$a40VqMRg5OvfaXz66VAHGuVNqdUIOvGBAOWzVy6T59Kfb8Sv1bZRy"
    server:
      service:
        type: NodePort
    bootstrap:
      enabled: true
