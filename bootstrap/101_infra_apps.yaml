apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://gitlab.com/simonoscr/gitops.git
      revision: HEAD
      directories:
      - path: infra/monitoring/*
      #- path: infra/logging/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: infra
      source:
        repoURL: https://gitlab.com/simonoscr/gitops.git
        targetRevision: HEAD
        path: '{{.path.path}}'
        helm:
          releaseName: '{{.path.basename}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
