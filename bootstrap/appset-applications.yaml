apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - application: vaultwarden
        namespace: vaultwarden
        path: apps/vaultwarden
  template:
    metadata:
      name: "{{.application}}"
    spec:
      project: applications
      source:
        repoURL: https://gitlab.com/simonoscr/gitops-bootstrap.git
        targetRevision: HEAD
        path: "{{.path}}"
        helm:
          releaseName: "{{.application}}"
          valueFiles:
          - "values.yaml"
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
