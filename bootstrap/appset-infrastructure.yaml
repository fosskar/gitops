apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - application: monitoring-stack
        namespace: monitoring
        path: infra/monitoring-stack
        serverSideApply: true
      - application: gitlab-runner
        namespace: gitlab-runner
        path: infra/gitlab-runner
        serverSideApply: false
      #- application: security
      #  namespace: security
      #  path: infra/security
  template:
    metadata:
      name: "{{.application}}"
    spec:
      project: infrastructure
      source:
        repoURL: https://gitlab.com/simonoscr/gitops-bootstrap.git
        targetRevision: HEAD
        path: "{{.path}}"
        helm:
          releaseName: "{{.application}}"
          valueFiles:
          - "values.yaml"
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply={{.serverSideApply}}
