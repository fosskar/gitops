apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://codeberg.org/smonoscr/gitops.git
    targetRevision: main
    path: external-secrets-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true