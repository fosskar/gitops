---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://kubernetes-sigs.github.io/cluster-api-operator
    chart: cluster-api-operator
    targetRevision: v0.22.0
    helm:
      values: |
        core:
          cluster-api:
            namespace: capi-system
            createNamespace: true
        bootstrap:
          talos:
            namespace: talos-bootstrap-system
            createNamespace: true
        controlPlane:
          talos:
            namespace: talos-control-plane-system
            createNamespace: true
        infrastructure:
          proxmox:
            namespace: capmox-system
            createNamespace: true
        ipam:
          in-cluster:
            namespace: capi-ipam-system
            createNamespace: true
        addon:
          helm:
            namespace: capi-addon-system
            createNamespace: true
        manager:
          featureGates:
            core:
              ClusterTopology: true
            proxmox:
              ClusterTopology: true
  destination:
    server: https://kubernetes.default.svc
    namespace: capi-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
