apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: infrastructure-update-helm-chart-dep
  namespace: infrastructure
spec:
  vars:
    # Variables without a default value are required and must be provided when the task is referenced in a Promotion Template.
    - name: gitRepo
      value: git@gitlab.com:simonoscr/gitops.git
    - name: sourceBranch
      value: main
    - name: targetBranch
      value: main
    - name: chartDir
    - name: chartName
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - path: ./out
    - uses: helm-update-chart
      config:
        path: ./out/${{ vars.chartDir }}/${{ ctx.stage }}
        charts:
          - repository: ${{ vars.chartRepo }}
            name: ${{ vars.chartName }}
            version: ${{ chartFrom(vars.chartRepo + "/" + vars.chartName).Version }}
    - uses: git-commit
      config:
        path: ./out
        message: |
          ${{ vars.chartName }}(${{ ctx.stage }}): update helm-chart to ${{ chartFrom(vars.chartRepo + "/" + vars.chartName).Version }}
    - uses: git-push
      config:
        path: ./out
        branch: ${{ vars.targetBranch }}
