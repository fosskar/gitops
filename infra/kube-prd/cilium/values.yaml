# cilium configuration for kube-prd cluster on talos
# matches bootstrap job configuration for seamless takeover

# load balancer ip pool configuration
loadBalancerIPPool:
  enabled: true
  name: kube-prd-lb-pool
  cidr: "10.10.10.120/32"

# l2 announcement policy configuration
l2AnnouncementPolicy:
  enabled: true
  name: kube-prd-l2-policy
  loadBalancerIPs: true
  externalIPs: true
  interfaces:
    - "^eth[0-9]+$"
cilium:
  # set upgrade compatibility to current version
  upgradeCompatibility: "1.18"

  # kube-proxy replacement (matches bootstrap job)
  kubeProxyReplacement: "true"
  k8sServiceHost: localhost
  k8sServicePort: 7445

  # cluster identification (default is "default", not "kube-prd")
  cluster:
    name: kube-prd

  rollOutCiliumPods: true

  # enable direct routing for better performance on same L2 network
  routingMode: native
  autoDirectNodeRoutes: true
  directRoutingSkipUnreachable: true
  ipv4NativeRoutingCIDR: "10.10.10.0/24"

  l2announcements:
    enabled: true

  externalIPs:
    enabled: true

  ingressController:
    enabled: true
    default: true
    loadbalancerMode: shared
    service:
      allocateLoadBalancerNodePorts: false

  # gateway api support (requires envoy)
  gatewayAPI:
    enabled: true

  # wireguard encryption for pod-to-pod traffic
  encryption:
    enabled: true
    type: wireguard
    nodeEncryption: true

  ipam:
    mode: kubernetes

  bpf:
    masquerade: true
    hostLegacyRouting: false

  socketLB:
    enabled: true
    hostNamespaceOnly: true
    terminatePodConnections: true

  # talos-specific cgroup configuration
  # talos mounts cgroup2 at /sys/fs/cgroup, not /run/cilium/cgroupv2
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  # envoy proxy for gateway api (default is null, not true)
  envoy:
    enabled: true

  # talos-specific security context capabilities (remove SYS_MODULE)
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  # hubble observability
  hubble:
    enabled: true
    relay:
      enabled: true
      rollOutPods: true
    ui:
      enabled: true
      rollOutPods: true
      ingress:
        enabled: true
        hosts:
          - hubble.kube-prd.lan
        tls:
          - secretName: hubble-ingress-tls
            hosts:
              - hubble.kube-prd.lan
