apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-qa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://gitlab.com/simonoscr/gitops.git
    targetRevision: 59233eed7d0e56d4775a872af0d68adccda832cf
    path: infra/hello-world/qa
    helm:
      releaseName: hello-world-qa
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
