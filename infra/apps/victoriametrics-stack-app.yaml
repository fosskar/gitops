apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoriametrics-stack
  namespace: argocd
spec:
  project: infra
  source:
    repoURL: https://gitlab.com/simonoscr/gitops.git
    targetRevision: main
    path: infra/victoriametrics-stack
    helm:
      releaseName: vm
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        kargo.akuity.io/project: "true"
